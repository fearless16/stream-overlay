<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cricket With Prajjwal · Portrait</title>
  <link rel="stylesheet" href="portrait.css">
  <script src="portrait.js" defer></script>
</head>
<body data-mode="live">
  <main id="canvas" aria-label="Cricket With Prajjwal Watch-along">
    <aside class="comment" id="comment" aria-label="Selected live chat comment" hidden>
      <div class="byline"><span class="chat-label">LIVE CHAT</span><bdi id="comment-name"></bdi></div>
      <p id="comment-text" dir="auto"></p>
    </aside>
    <section class="slate">
      <div class="slate-motif" aria-hidden="true"></div>
      <div class="eyebrow" id="slate-kicker"></div><h1 id="slate-title"></h1><p id="slate-copy"></p>
    </section>
    <div class="guides" aria-hidden="true" hidden><span>RESERVED FOR PLAYER UI</span></div>
  </main>
</body>
</html>
