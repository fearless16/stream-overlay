<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STICKER FX — local preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:ital,wght@0,900;1,900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #fff; }

  /* Quiet stand-in for the real overlay background so smoke/embers read well */
  .scene {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 62% 30%, rgba(30, 70, 140, 0.25), transparent 55%),
      radial-gradient(ellipse at 24% 78%, rgba(120, 20, 30, 0.22), transparent 60%),
      linear-gradient(160deg, #0a0a12 0%, #05050a 100%);
  }
  .scene::after {
    content: 'OBS SCENE PLACEHOLDER — 1920×1080';
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 13px; letter-spacing: 6px; color: rgba(255,255,255,0.10); font-weight: 700;
  }

  .harness {
    position: fixed; top: 18px; left: 18px; z-index: 20000;
    width: 320px; padding: 16px;
    background: rgba(10, 10, 16, 0.92);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    backdrop-filter: blur(8px);
  }
  .harness h1 { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #ffb15e; margin-bottom: 10px; }
  .harness button {
    width: 100%; margin-bottom: 7px; padding: 9px 11px;
    text-align: left; font: 600 12px/1.2 inherit; color: #eee;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 8px; cursor: pointer;
  }
  .harness button:hover { background: rgba(255,255,255,0.12); }
  .harness button.hot { background: rgba(255,120,20,0.18); border-color: rgba(255,120,20,0.4); color: #ffd7a8; }
  .harness .row { display: flex; gap: 7px; }
  .harness .row button { margin-bottom: 7px; }
  .harness .note { font-size: 10px; line-height: 1.5; color: rgba(255,255,255,0.5); margin-top: 6px; }
  #status { margin-top: 8px; font: 11px/1.5 ui-monospace, monospace; color: #8ce99a; white-space: pre-wrap; min-height: 40px; }

  /* Fake fullscreen overlays used to prove stage exclusivity */
  .fake-overlay {
    position: fixed; inset: 0; z-index: 9999; display: none;
    align-items: center; justify-content: center;
    font: 900 54px 'Inter', sans-serif; letter-spacing: 4px;
    pointer-events: none;
  }
  .fake-overlay.active { display: flex; }
  #like-overlay { background: rgba(255, 30, 70, 0.55); color: #fff; }
  #member-join-overlay { background: rgba(0, 230, 118, 0.45); color: #04220f; }
  #user-alert-overlay { background: rgba(0, 212, 255, 0.42); color: #03212b; }
  #brb-overlay { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; background: #05050a; color: #fff; font: 900 44px 'Inter', sans-serif; }
  #brb-overlay.active { display: flex; }
</style>
<link rel="stylesheet" href="sticker-fx.css">
<script src="sticker-fx.js" defer></script>
</head>
<body>
<div class="scene"></div>

<div class="harness">
  <h1>Sticker FX Harness</h1>
  <button class="hot" onclick="StickerFX.play({ name: 'Rahul S.', source: 'preview' })">▶ Play DISGUSTING moment</button>
  <button onclick="StickerFX.play({ name: 'ThisIsAnExtremelyLongViewerNameToStressTheCaption', source: 'preview' })">▶ Play with very long name</button>
  <button onclick="StickerFX.play({ name: 'SuperFan', amount: '$5.00', source: 'preview' })">▶ Play as super chat</button>
  <div class="row">
    <button onclick="fake('like-overlay')">Like overlay</button>
    <button onclick="fake('member-join-overlay')">Member overlay</button>
  </div>
  <div class="row">
    <button onclick="fake('user-alert-overlay')">New viewer</button>
    <button onclick="fakeBRB()">BRB on/off</button>
  </div>
  <button onclick="StickerFX.stop('preview-stop')">■ Stop</button>
  <div id="status">idle</div>
  <div class="note">Start a fake overlay, then press Play: the sticker stage must pre-empt it. While BRB is on, Play must be skipped.</div>
</div>

<div id="like-overlay" class="fake-overlay">LIKE</div>
<div id="member-join-overlay" class="fake-overlay">MEMBER JOIN</div>
<div id="user-alert-overlay" class="fake-overlay">NEW VIEWER</div>
<div id="brb-overlay">BRB</div>

<script>
  const statusEl = document.getElementById('status');
  const log = [];
  function render() {
    document.getElementById('status').textContent = log.slice(-4).join('\n');
  }
  document.addEventListener('sticker-fx', (e) => {
    log.push(`[${new Date(e.detail.at).toLocaleTimeString()}] ${e.detail.type}` +
      (e.detail.reason ? ' — ' + e.detail.reason : '') +
      (e.detail.stats ? ` (${e.detail.stats.frames}f, ${e.detail.stats.longFrames} long, max ${e.detail.stats.maxGap}ms)` : ''));
    render();
  });
  function fake(id) {
    document.querySelectorAll('.fake-overlay').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function fakeBRB() {
    document.getElementById('brb-overlay').classList.toggle('active');
  }
  setInterval(() => {
    if (window.StickerFX) {
      const s = StickerFX.status();
      document.getElementById('status').textContent =
        `busy=${s.playing} pending=${s.pending} cooldown=${s.cooldownMs}ms\n` + log.slice(-3).join('\n');
    }
  }, 400);
</script>
</body>
</html>
