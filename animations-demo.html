<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ultimate Cinematic Animations Lab</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: 
    linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
    url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
  color: #fff;
  font-family: 'Inter', -apple-system, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden;
}

#controls {
  position: absolute; top: 20px; left: 20px;
  background: rgba(0,0,0,0.9);
  padding: 20px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.2);
  display: flex; flex-direction: column; gap: 15px;
  z-index: 10000;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.btn-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
button {
  background: #2a2a35; border: 1px solid #444; color: #fff;
  padding: 8px 12px; border-radius: 6px; cursor: pointer;
  font-weight: bold; font-family: 'Inter'; transition: 0.1s;
}
button:hover { background: #ff2d55; border-color: #ff2d55; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,45,85,0.4); }
button:active { transform: scale(0.95); }

/* Inject Chat Overlay CSS */

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:ital,wght@0,900;1,900&display=swap');

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --neon-blue: #00d4ff;
  --neon-red: #ff2d55;
  --gold: #FFD700;
  --green: #00E676;
  --purple: #CE93D8;
  --text: #f0f0f5;
  --text2: #a0a0b0;
  --muted: #555;
  --bg-dark: #06040e;
  --panel-bg: rgba(8, 6, 16, 0.92);
  --glass-border: rgba(255, 255, 255, 0.06);
  --glass-highlight: rgba(255, 255, 255, 0.03);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-glow-red: 0 0 20px rgba(255,45,85,0.15);
  --shadow-glow-blue: 0 0 20px rgba(0,212,255,0.15);
}

body {
  background: transparent;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  width: 1920px; height: 1080px;
  overflow: hidden;
  color: var(--text);
  font-size: 17px;
  line-height: 1.5;
}

/* Camera passthrough — center area stays transparent for video feed */



/* ════════════════════════════════════════
   RIGHT PANEL
   ════════════════════════════════════════ */
#right-panel {
  position: fixed; top: 0; right: 0;
  width: 520px; height: 1080px;
  z-index: 10;
  padding: 24px 20px 24px;
  display: flex; flex-direction: column;
  gap: 14px;
  pointer-events: none;
}

#chat-panel {
  flex: 1; min-height: 0;
  background: var(--panel-bg);
  backdrop-
  border: 1px solid rgba(255,45,85,0.25);
  border-radius: 16px;
  padding: 16px 14px 14px 16px;
  display: flex; flex-direction: column;
  box-shadow:
    0 0 0 1px rgba(255,45,85,0.06),
    0 0 40px rgba(255,45,85,0.1),
    inset 0 0 60px rgba(255,45,85,0.02);
  position: relative;
  overflow: hidden;
  pointer-events: auto;
}
#chat-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 5%, var(--neon-red) 40%, rgba(255,45,85,0.3) 70%, transparent 95%);
  pointer-events: none;
}

.chat-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,45,85,0.1);
  flex-shrink: 0;
}
.chat-hdr .title {
  font-size: 15px; font-weight: 900;
  text-transform: uppercase; letter-spacing: 3px;
  color: rgba(255,255,255,0.85);
  display: flex; align-items: center; gap: 10px;
}
.chat-hdr .title .live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--neon-red);
  box-shadow: 0 0 12px var(--neon-red);
  animation: livePulse 1.5s ease-in-out infinite;
  flex-shrink: 0;
}
.chat-hdr .count {
  background: rgba(255,45,85,0.08);
  color: rgba(255,255,255,0.35);
  border: 1px solid rgba(255,45,85,0.12);
  padding: 4px 12px; border-radius: 999px;
  font-size: 14px; font-weight: 800;
  transition: all 0.3s;
}
.chat-hdr .count.pulse {
  background: rgba(255,45,85,0.2);
  color: var(--neon-red);
  transform: scale(1.1);
}

#chat-container {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 4px;
  position: relative;
}

#chat-container::-webkit-scrollbar { width: 4px; }
#chat-container::-webkit-scrollbar-track { background: transparent; }
#chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.msg {
  display: flex; flex-direction: column;
  gap: 4px;
  padding: 12px 16px 12px 18px;
  margin-bottom: 8px;
  border-radius: 10px;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.04);
  border-left: 3px solid rgba(255,45,85,0.4);
  /* Keep the hit area fixed while the pointer crosses the gap between
     messages. Transforming a hovered card moves its hit area under the
     pointer and makes Chromium repeatedly enter/leave adjacent cards. */
  transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  overflow: hidden;
}

/* Only NEW live messages animate in; replayed history appears instantly so
   scrolling stays smooth and never fights a backlog of entrance animations. */
.msg.new-entry { animation: msgEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

.msg:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.1);
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}

.msg.pinned {
  border-left-color: var(--gold);
  background: linear-gradient(90deg, rgba(255,215,0,0.04), rgba(255,255,255,0.03));
}

.msg .msg-actions {
  position: absolute; top: 4px; right: 6px;
  display: flex; gap: 4px;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 2;
}
.msg:hover .msg-actions { opacity: 1; }
.msg-action-btn {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.msg-action-btn:hover { background: rgba(255,255,255,0.2); color: var(--text); }
.msg-action-btn.pin:hover { background: rgba(255,215,0,0.2); color: var(--gold); }
.msg-action-btn.del:hover { background: rgba(255,45,85,0.2); color: var(--neon-red); }

.msg .msg-top {
  display: flex; align-items: center; gap: 8px;
  padding-right: 50px;
}
.msg .badge {
  font-size: 12px; font-weight: 800;
  padding: 3px 9px; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.8px;
  flex-shrink: 0;
  border: 1px solid transparent;
}
.msg .name {
  font-size: 19px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 280px;
  letter-spacing: -0.2px;
}
.msg .msg-time {
  font-size: 13px; color: var(--muted);
  margin-left: auto;
  font-weight: 600;
  flex-shrink: 0;
}
.msg .text {
  font-size: 19px; color: rgba(240,236,228,0.75);
  font-weight: 500; line-height: 1.45;
  word-break: break-word;
  padding-right: 20px;
}

.emoji-img { width:20px; height:20px; vertical-align:middle; display:inline-block; }
.sc-card .emoji-img { width:32px; height:32px; vertical-align:middle; display:inline-block; }

.msg[style*="--user-color"] { border-left-color: var(--user-color) !important; }
.msg.chat { border-left-color: rgba(255,45,85,0.4); }
.msg.superchat { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(255,215,0,0.03), rgba(255,255,255,0.02)); }
.msg.membership { border-left-color: var(--green); background: linear-gradient(90deg, rgba(0,230,118,0.03), rgba(255,255,255,0.02)); }
.msg.moderator { border-left-color: var(--neon-blue); background: linear-gradient(90deg, rgba(0,212,255,0.03), rgba(255,255,255,0.02)); }
.msg.announcement { border-left-color: #448AFF; background: linear-gradient(90deg, rgba(68,138,255,0.03), rgba(255,255,255,0.02)); }

.msg .badge.superchat { background: rgba(255,215,0,0.12); color: var(--gold); border-color: rgba(255,215,0,0.25); }
.msg .badge.membership { background: rgba(0,230,118,0.12); color: var(--green); border-color: rgba(0,230,118,0.25); }
.msg .badge.moderator { background: rgba(0,212,255,0.12); color: var(--neon-blue); border-color: rgba(0,212,255,0.25); }
.msg .badge.announcement { background: rgba(68,138,255,0.12); color: #448AFF; border-color: rgba(68,138,255,0.25); }

.msg.superchat .name { color: var(--gold) !important; }
.msg.superchat .text { color: rgba(255,240,180,0.85); }
.msg.membership .text { color: rgba(0,230,118,0.85); }

.msg.retracted {
  border-left-color: #ff1744 !important;
  background: linear-gradient(90deg, rgba(255,23,68,0.06), rgba(255,23,68,0.02)) !important;
  opacity: 0.65;
  position: relative;
}
.msg.retracted::after {
  content: 'RETRACTED';
  position: absolute; top: 4px; right: 34px;
  font-size: 11px; font-weight: 900;
  color: #ff1744;
  letter-spacing: 1.5px;
  opacity: 0.7;
}
.msg.retracted .name {
  text-decoration: line-through;
  text-decoration-color: #ff1744;
}
.msg.retracted .text {
  color: rgba(255,23,68,0.5) !important;
}
@keyframes msgEnter {
  0% { transform: translateX(20px) scale(0.95); opacity: 0; filter: brightness(2); }
  100% { transform: translateX(0) scale(1); opacity: 1; filter: brightness(1); }
}

/* FIX: increased max-height from 100px to 200px to prevent clipping tall messages */
@keyframes msgExit {
  0%   { opacity: 1; transform: translateY(0) scale(1); max-height: 200px; margin-bottom: 4px; }
  100% { opacity: 0; transform: translateY(-12px) scale(0.92); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
}

.msg.exiting {
  animation: msgExit 0.4s cubic-bezier(0.4, 0, 1, 1) forwards;
  pointer-events: none;
}

#superchat-panel {
  background: rgba(255,215,0,0.03);
  border: 1px solid rgba(255,215,0,0.1);
  border-radius: 12px;
  padding: 12px;
  flex-shrink: 0;
  max-height: 100px;
  overflow: hidden;
  pointer-events: auto;
}
.sp-hdr {
  font-size: 13px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.sp-hdr::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,215,0,0.1), transparent);
}
.sp-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; margin-bottom: 4px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.sp-item:last-child { border-bottom: none; margin-bottom: 0; }
.sp-item .sp-name { font-weight: 700; color: var(--green); flex-shrink: 0; }
.sp-item .sp-text { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-size: 14px; }
.sp-item .sp-amt { font-weight: 800; color: var(--gold); flex-shrink: 0; font-size: 15px; }

/* ════════════════════════════════════════
   SHOW COMMENT OVERLAY — Floating pill on top border
   ════════════════════════════════════════ */
#show-comment {
  position: fixed; inset: 0;
  z-index: 100;
  display: none; align-items: flex-end; justify-content: flex-start;
  padding: 0 0 40px 80px;
  pointer-events: none;
}
#show-comment.active { display: flex; pointer-events: all; }

.sc-backdrop {
  position: absolute; inset: 0;
  background: transparent;
  cursor: pointer;
}

.sc-card {
  position: relative; z-index: 2;
  width: 900px;
  background: linear-gradient(160deg, rgba(12,9,20,0.95), rgba(6,4,14,0.97));
  backdrop-
  border: 1px solid rgba(255,45,85,0.15);
  border-left: 4px solid var(--neon-red);
  border-radius: 20px;
  padding: 28px 32px 24px;
  padding-top: 32px;
  animation: scCardIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  pointer-events: auto;
  overflow: visible;
  display: flex; flex-direction: row; align-items: center; gap: 24px;
}

.sc-card::before {
  content: '';
  position: absolute; inset: -1px;
  border-radius: 21px;
  border: 2px solid transparent;
  background: conic-gradient(from var(--sc-angle, 0deg), transparent 0deg, rgba(255,45,85,0.25) 120deg, rgba(0,212,255,0.2) 240deg, transparent 360deg) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  animation: scBorderGlow 4s linear infinite;
}
@property --sc-angle {
  syntax: '<angle>'; initial-value: 0deg; inherits: false;
}
@keyframes scBorderGlow {
  to { --sc-angle: 360deg; }
}

.sc-pill {
  position: absolute;
  top: -18px;
  left: 24px;
  display: inline-flex; align-items: center; gap: 10px;
  background: linear-gradient(135deg, rgba(255,45,85,0.92), rgba(140,0,30,0.95));
  border-radius: 999px;
  padding: 4px 16px 4px 4px;
  box-shadow: 0 4px 20px rgba(255,45,85,0.35);
  z-index: 5;
}

.sc-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900; color: #fff;
  flex-shrink: 0;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.2);
}

.sc-avatar img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
}

.sc-name {
  font-size: 17px; font-weight: 800; color: #fff;
  white-space: nowrap;
}

.sc-badge {
  font-size: 11px; font-weight: 800;
  padding: 3px 10px; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 1px;
  white-space: nowrap;
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
}

.sc-msg {
  font-size: 35px;
  font-family: 'Poppins', 'Inter', sans-serif;
  font-weight: 600;
  color: rgba(240,236,228,0.85);
  line-height: 1.4;
  word-break: break-word; white-space: pre-wrap;
  letter-spacing: 0.4px;
  word-spacing: 2px;
  flex: 1;
}

@keyframes scCardIn {
  0% { transform: translateX(-40px) scale(0.94); opacity: 0; }
  60% { transform: translateX(6px) scale(1.005); opacity: 1; }
  100% { transform: translateX(0) scale(1); opacity: 1; }
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

@keyframes livePulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

/* ════════════════════════════════════════
   BRAND BAR
   ════════════════════════════════════════ */
#brand-bar {
  position: fixed; top: 16px; left: 24px; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  background: rgba(8, 6, 16, 0.85);
  backdrop-
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 10px 18px 10px 12px;
  pointer-events: none;
}
#brand-logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--neon-red), #aa0022);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 900; color: #fff;
  box-shadow: 0 0 12px rgba(255,45,85,0.2);
  flex-shrink: 0;
}
#brand-info { display: flex; flex-direction: column; gap: 1px; }
#brand-name { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; }
#brand-live { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--neon-red); letter-spacing: 2px; text-transform: uppercase; }
#brand-live .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); animation: livePulse 1.5s ease-in-out infinite; }
#brand-health {
  display: flex; align-items: center; gap: 6px;
  margin-left: 8px; padding-left: 12px;
  border-left: 1px solid rgba(255,255,255,0.06);
}
#brand-health .health-indicator {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  transition: all 0.3s;
}
#brand-health .health-indicator.warning { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
#brand-health .health-indicator.error { background: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); animation: livePulse 1s infinite; }
#brand-health .health-text { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
#brand-viewers {
  display: flex; align-items: center; gap: 6px;
  margin-left: 10px; padding-left: 14px;
  border-left: 1px solid rgba(255,255,255,0.06);
}
#brand-viewers .viewer-count {
  font-size: 21px; font-weight: 900;
  color: var(--neon-blue);
  font-variant-numeric: tabular-nums;
  min-width: 44px;
  letter-spacing: -0.5px;
  text-shadow: 0 0 14px rgba(0,212,255,0.25);
  transition: all 0.25s ease;
}
#brand-viewers .viewer-count.updating {
  text-shadow: 0 0 24px rgba(0,212,255,0.55);
}
#brand-viewers .viewer-label {
  font-size: 11px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1.5px;
}

/* ════════════════════════════════════════
   SUBSCRIBER GOAL WIDGET — count-up to SUB_GOAL
   Standalone top-right chip (just left of the chat panel). Shows the channel's
   live subscriber count animating up toward the target, with a progress bar.
   Hidden until the first real subscriber payload arrives so it never shows a
   misleading "— / 500" before the Data API responds.
   ════════════════════════════════════════ */
  #sub-widget {
    width: 100%;
    background: linear-gradient(135deg, rgba(24,16,2,0.94), rgba(9,7,16,0.96));
    backdrop-
    border: 1px solid rgba(255,215,0,0.28);
    border-radius: 14px;
    padding: 14px 16px;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  #sub-widget::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(255,215,0,0.16), transparent 70%);
    pointer-events: none;
  }
  #sub-widget .sw-burst {
    position: absolute; right: 14px; top: 12px;
    width: 52px; height: 52px; pointer-events: none;
    border-radius: 50%;
    border: 2px solid rgba(255,215,0,0);
    opacity: 0;
  }
  #sub-widget.bumping .sw-burst { animation: subBurst 8s ease-out forwards; }
  #sub-widget.bumping .sw-count { animation: subPop 8s ease-in-out; }
  #sub-widget.bumping { animation: subGlow 8s ease-out; }
  @keyframes subBurst {
    0% { transform: scale(0.35); border-color: rgba(255,215,0,0.95); opacity: 1; }
    12% { transform: scale(1.15); border-color: rgba(255,215,0,0.85); opacity: 0.95; }
    35% { transform: scale(1.55); border-color: rgba(255,215,0,0.5); opacity: 0.7; }
    60% { transform: scale(1.95); border-color: rgba(255,215,0,0.28); opacity: 0.45; }
    100% { transform: scale(2.6); border-color: rgba(255,215,0,0); opacity: 0; }
  }
  @keyframes subPop {
    0% { transform: scale(1); }
    8% { transform: scale(1.32); text-shadow: 0 0 30px rgba(255,215,0,0.95); }
    20% { transform: scale(1.18); }
    38% { transform: scale(1.28); text-shadow: 0 0 34px rgba(255,215,0,0.9); }
    55% { transform: scale(1.2); }
    72% { transform: scale(1.26); text-shadow: 0 0 30px rgba(255,215,0,0.8); }
    85% { transform: scale(1.16); }
    100% { transform: scale(1); text-shadow: 0 0 18px rgba(255,215,0,0.35); }
  }
  @keyframes subGlow {
    0% { box-shadow: 0 0 0 rgba(255,215,0,0); }
    10% { box-shadow: 0 0 36px 8px rgba(255,215,0,0.55); }
    45% { box-shadow: 0 0 26px 5px rgba(255,215,0,0.4); }
    100% { box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  }
#sub-widget.hidden { display: none; }
#sub-widget .sw-top {
  display: flex; align-items: baseline; gap: 6px;
}
#sub-widget .sw-count {
  font-size: 46px; font-weight: 900;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  letter-spacing: -1px;
  text-shadow: 0 0 20px rgba(255,215,0,0.4);
  line-height: 1;
}
#sub-widget .sw-slash { font-size: 28px; font-weight: 800; color: var(--muted); }
#sub-widget .sw-goal { font-size: 32px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
#sub-widget .sw-bar {
  height: 10px; border-radius: 5px;
  background: rgba(255,255,255,0.12);
  overflow: hidden; margin-top: 10px;
}
#sub-widget .sw-bar i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold), #ff9500);
  border-radius: 5px;
  transition: width 0.9s ease;
}
#sub-widget.reached .sw-bar i { background: linear-gradient(90deg, var(--green), #00b3a4); }
#sub-widget .sw-bottom {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 9px;
}
#sub-widget .sw-label {
  font-size: 14px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 2px;
}
#sub-widget .sw-remain { font-size: 16px; font-weight: 800; color: #ff9500; font-variant-numeric: tabular-nums; }
#sub-widget.reached .sw-remain { color: var(--green); }

/* Mobile / small screens: make the subscriber widget a full-width prominent banner */
@media (max-width: 820px) {
  #right-panel { right: 0; left: 0; width: 100%; padding: 10px 10px; gap: 10px; }
  #sub-widget { border-radius: 16px; padding: 16px 18px; }
  #sub-widget .sw-count { font-size: 58px; }
  #sub-widget .sw-slash { font-size: 36px; }
  #sub-widget .sw-goal { font-size: 42px; }
  #sub-widget .sw-label { font-size: 17px; }
  #sub-widget .sw-remain { font-size: 19px; }
  #sub-widget .sw-burst { width: 84px; height: 84px; }
}

/* ════════════════════════════════════════
    SCORECARD — State of the Art
    ════════════════════════════════════════ */
#scorecard {
  position: fixed; top: 92px; left: 24px;
  width: 480px;
  max-height: calc(1080px - 160px);
  background: linear-gradient(160deg, rgba(10,8,18,0.96), rgba(6,4,14,0.98));
  saturate(1.4);
  border: 1px solid rgba(255,45,85,0.1);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.5),
    0 0 60px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.04);
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
#scorecard.sc-enter {
  animation: scCardEntry 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
#scorecard::before {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; border-radius: 18px;
}
#scorecard::after {
  content: ''; position: absolute; inset: -1px;
  border-radius: 18px;
  background: conic-gradient(from var(--sc-angle), transparent 0%, rgba(255,45,85,0.15) 25%, transparent 50%, rgba(0,212,255,0.15) 75%, transparent 100%);
  animation: scBorderRotate 6s linear infinite;
  pointer-events: none; z-index: -1;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  -webkit-mask-composite: xor;
  padding: 1px;
}
#scorecard.hidden {
  opacity: 0;
  transform: translateY(-20px) scale(0.94);
  pointer-events: none;
}
@keyframes scCardEntry {
  0% { opacity: 0; transform: translateY(-30px) scale(0.92); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes scBorderRotate {
  to { --sc-angle: 360deg; }
}

.sc-hdr {
  background: linear-gradient(135deg, rgba(255,45,85,0.08), rgba(0,212,255,0.04));
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,45,85,0.08);
  position: relative; z-index: 1;
}
.sc-hdr::after {
  content: ''; position: absolute; bottom: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,45,85,0.2), rgba(0,212,255,0.15), transparent);
}
.sc-hdr .sc-title {
  font-size: 12px; font-weight: 900; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--neon-blue);
  display: flex; align-items: center; gap: 8px;
  text-shadow: 0 0 12px rgba(0,212,255,0.3);
}
.sc-hdr .sc-title::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--neon-blue);
  box-shadow: 0 0 8px var(--neon-blue), 0 0 20px rgba(0,212,255,0.3);
  animation: scDotPulse 2s ease-in-out infinite;
}
.sc-hdr .sc-live {
  font-size: 11px; font-weight: 800; color: var(--neon-red);
  display: flex; align-items: center; gap: 6px;
  letter-spacing: 1.5px;
  text-shadow: 0 0 12px rgba(255,45,85,0.3);
}
.sc-hdr .sc-live::before {
  content: ''; width: 5px; height: 5px;
  background: var(--neon-red); border-radius: 50%;
  animation: livePulse 1.5s ease-in-out infinite;
  box-shadow: 0 0 8px var(--neon-red), 0 0 20px rgba(255,45,85,0.4);
}

@keyframes scDotPulse {
  0%,100% { box-shadow: 0 0 8px var(--neon-blue), 0 0 20px rgba(0,212,255,0.3); }
  50% { box-shadow: 0 0 12px var(--neon-blue), 0 0 30px rgba(0,212,255,0.5); }
}

.sc-bd {
  padding: 14px 16px 16px;
  position: relative;
  z-index: 1;
  max-height: calc(1080px - 232px);
  overflow: hidden;
}

.sc-tms {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr);
  align-items: start;
  column-gap: 6px;
  margin-bottom: 14px;
  position: relative;
}
.sc-t {
  text-align: center;
  min-width: 0;
  padding: 8px 4px;
  border-radius: 12px;
  transition: all 0.3s ease;
  position: relative;
}
.sc-t.active {
  background: rgba(255,255,255,0.035);
  box-shadow: inset 0 0 0 1px rgba(255,215,0,0.12);
}
.sc-t-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 16px; padding: 0 7px; margin-bottom: 6px;
  border-radius: 999px;
  background: rgba(255,215,0,0.1);
  color: var(--gold);
  font-size: 10px; font-weight: 900;
  letter-spacing: 1px; text-transform: uppercase;
}
.sc-t::before {
  content: ''; position: absolute; inset: 0;
  border-radius: 12px;
  background: radial-gradient(ellipse at center, var(--t1c, rgba(255,255,255,0.02)) 0%, transparent 70%);
  opacity: 0.06;
  transition: opacity 0.3s;
}
.sc-t:last-child::before {
  background: radial-gradient(ellipse at center, var(--t2c, rgba(255,255,255,0.02)) 0%, transparent 70%);
}
.sc-t-flag {
  font-size: 51px; margin-bottom: 6px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}
.sc-t:hover .sc-t-flag { transform: scale(1.15) translateY(-2px); }
.sc-t-name {
  font-size: 15px; font-weight: 800; color: var(--text);
  margin-bottom: 6px; letter-spacing: 0;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 100%;
}
.sc-t-score {
  font-size: 33px; font-weight: 900;
  background: linear-gradient(135deg, var(--gold), #ff9500, var(--gold));
  background-size: 200% 200%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1;
  letter-spacing: -1px;
  animation: scScoreShimmer 3s ease-in-out infinite;
  filter: drop-shadow(0 0 8px rgba(255,215,0,0.15));
  transition: filter 0.3s;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.sc-t-score.blank {
  font-size: 18px;
  -webkit-text-fill-color: var(--muted);
  background: none;
  color: var(--muted);
  letter-spacing: 0;
  animation: none;
}
.sc-t-sep {
  -webkit-text-fill-color: rgba(255,215,0,0.4);
  font-weight: 700;
}
.sc-t-wk {
  font-size: 25px;
}
.sc-t-ov {
  font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 700;
  letter-spacing: 0.5px;
  min-height: 12px;
}
.sc-vs {
  font-size: 13px; color: rgba(255,255,255,0.15); font-weight: 900;
  padding-top: 48px; position: relative;
  letter-spacing: 2px;
  text-align: center;
}
.sc-vs::before, .sc-vs::after {
  content: ''; position: absolute; left: 50%; width: 1px;
  background: linear-gradient(180deg, transparent, rgba(255,255,255,0.08), transparent); height: 24px;
}
.sc-vs::before { top: 16px; }
.sc-vs::after { top: 72px; }
.sc-format-badge {
  display: block; margin: 0 auto 4px;
  font-size: 10px; font-weight: 900; letter-spacing: 1px;
  color: #fff; background: rgba(255,255,255,0.08);
  padding: 1px 6px; border-radius: 4px;
  text-align: center; width: fit-content;
}
.sc-t-img-flag {
  width: 44px; height: 44px; object-fit: contain;
  display: inline-block; vertical-align: middle;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

@keyframes scScoreShimmer {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.sc-score-changed .sc-t-score {
  filter: drop-shadow(0 0 16px rgba(255,215,0,0.5));
  animation: scScoreShimmer 3s ease-in-out infinite, scScoreFlash 0.6s ease;
}
@keyframes scScoreFlash {
  0% { filter: drop-shadow(0 0 4px rgba(255,215,0,0.2)); transform: scale(1); }
  30% { filter: drop-shadow(0 0 24px rgba(255,215,0,0.7)); transform: scale(1.08); }
  100% { filter: drop-shadow(0 0 8px rgba(255,215,0,0.15)); transform: scale(1); }
}

.sc-bmen {
  border-top: 1px solid rgba(255,45,85,0.06);
  padding-top: 12px;
}
.sc-bm {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 12px;
  padding: 7px 8px; font-size: 14px;
  border-radius: 8px;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.sc-bm::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(255,255,255,0.02), transparent);
  opacity: 0; transition: opacity 0.2s;
  border-radius: 8px;
}
.sc-bm:hover::before { opacity: 1; }
.sc-bm:hover { transform: translateX(3px); }

.sc-bm-enter {
  animation: scBmSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes scBmSlideIn {
  0% { opacity: 0; transform: translateX(-20px) scale(0.95); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}

.sc-bm-avatar {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.sc-bm-name {
  color: var(--text); font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sc-bm-name .str {
  color: var(--gold); font-size: 12px;
  animation: scStarPulse 1.5s ease-in-out infinite;
}
@keyframes scStarPulse {
  0%,100% { opacity: 1; text-shadow: 0 0 4px rgba(255,215,0,0.3); }
  50% { opacity: 0.6; text-shadow: 0 0 8px rgba(255,215,0,0.6); }
}
.sc-bm-score {
  color: var(--gold); font-weight: 900; font-size: 18px;
  min-width: 64px; text-align: right;
  text-shadow: 0 0 8px rgba(255,215,0,0.15);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.sc-bm-score-balls {
  color: var(--muted); font-size: 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.sc-bowler {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 10px;
  padding: 8px 8px; font-size: 13px;
  border-top: 1px solid rgba(255,45,85,0.06);
  margin-top: 8px; padding-top: 10px;
  border-radius: 8px;
  transition: all 0.3s ease;
}
.sc-bowler-changed {
  animation: scBowlerFlash 0.5s ease;
}
@keyframes scBowlerFlash {
  0% { background: transparent; }
  30% { background: rgba(0,212,255,0.06); }
  100% { background: transparent; }
}
.sc-bowler-name { color: var(--text); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-bowler-eco { color: var(--muted); font-size: 12px; font-weight: 600; }
.sc-bowler-fig {
  color: var(--neon-blue); font-weight: 800; font-size: 15px;
  text-shadow: 0 0 8px rgba(0,212,255,0.15);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.sc-over {
  display: flex; align-items: center; gap: 6px;
  margin-top: 10px; flex-wrap: wrap;
  padding-top: 10px;
  border-top: 1px solid rgba(255,45,85,0.04);
}
.sc-over-label {
  font-size: 11px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1.5px;
  margin-right: 8px;
}
.sc-ball {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
  color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  font-variant-numeric: tabular-nums;
}
.sc-ball:hover { transform: scale(1.25); box-shadow: 0 0 12px rgba(255,255,255,0.1); }
.sc-ball.dot { color: rgba(255,255,255,0.2); font-size: 17px; }
.sc-ball.wicket {
  background: rgba(255,45,85,0.25); color: var(--neon-red);
  border-color: rgba(255,45,85,0.4);
  box-shadow: 0 0 12px rgba(255,45,85,0.3), inset 0 0 8px rgba(255,45,85,0.1);
  animation: scBallWicketPulse 1s ease-in-out infinite;
}
.sc-ball.four {
  background: rgba(0,212,255,0.2); color: var(--neon-blue);
  border-color: rgba(0,212,255,0.4);
  box-shadow: 0 0 12px rgba(0,212,255,0.25), inset 0 0 8px rgba(0,212,255,0.1);
}
.sc-ball.six {
  background: rgba(255,215,0,0.25); color: var(--gold);
  border-color: rgba(255,215,0,0.4);
  box-shadow: 0 0 12px rgba(255,215,0,0.3), inset 0 0 8px rgba(255,215,0,0.1);
}
.sc-ball.wide { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.35); font-style: italic; font-size: 11px; }

.sc-ball-pop {
  animation: scBallPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes scBallPop {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes scBallWicketPulse {
  0%,100% { box-shadow: 0 0 12px rgba(255,45,85,0.3); }
  50% { box-shadow: 0 0 20px rgba(255,45,85,0.5); }
}

.sc-rates {
  display: flex; justify-content: center; gap: 16px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,45,85,0.05);
}
.sc-rate {
  display: flex; align-items: center; gap: 6px;
  flex: 1;
}
.sc-rate-label {
  font-size: 11px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px;
  min-width: 28px;
}
.sc-rate-val {
  font-size: 14px; font-weight: 800; color: var(--text);
  min-width: 32px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.sc-rate-track {
  flex: 1; height: 4px;
  background: rgba(255,255,255,0.04);
  border-radius: 2px; overflow: hidden;
  min-width: 40px;
}
.sc-rate-fill {
  height: 100%; border-radius: 2px;
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
}
.sc-rate-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shimmer 2.5s infinite;
}

.sc-partner {
  font-size: 12px; color: var(--muted); text-align: center;
  margin-top: 8px; font-weight: 700;
  letter-spacing: 0.3px;
}
.sc-last-wk {
  font-size: 12px; color: rgba(255,45,85,0.5); text-align: center;
  margin-top: 4px; font-weight: 700;
}
.sc-lead-trail {
  font-size: 13px; color: var(--gold); text-align: center;
  margin-top: 8px; font-weight: 800;
  letter-spacing: 0.2px;
}
.sc-session {
  font-size: 12px; color: var(--muted); text-align: center;
  margin-top: 6px; font-weight: 700; letter-spacing: 0.4px;
  text-transform: uppercase;
}
.sc-innings {
  display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
  margin-top: 8px;
}
.sc-inn-chip {
  display: inline-flex; align-items: baseline; gap: 5px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 12px; color: var(--text2); font-weight: 700;
}
.sc-inn-chip .sc-inn-name { color: var(--muted); }
.sc-inn-chip.sc-inn-live {
  border-color: rgba(255,45,85,0.5);
  background: rgba(255,45,85,0.08);
  color: var(--gold);
}
.sc-inn-chip.sc-inn-live .sc-inn-name { color: var(--gold); }
.sc-status {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid rgba(255,45,85,0.06);
  font-size: 14px; color: var(--text2); font-weight: 700;
  text-align: center;
  animation: scStatusFadeIn 0.5s ease both;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
@keyframes scStatusFadeIn {
  0% { opacity: 0; transform: translateY(4px); }
  100% { opacity: 1; transform: translateY(0); }
}
.sc-empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 15px; font-weight: 700; }

#scorecard.sc-update { animation: scUpdateFlash 0.6s ease; }
@keyframes scUpdateFlash {
  0% { filter: brightness(1); border-color: rgba(255,45,85,0.1); }
  15% { filter: brightness(1.3); border-color: rgba(255,45,85,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,45,85,0.15), 0 0 40px rgba(255,45,85,0.08); }
  100% { filter: brightness(1); border-color: rgba(255,45,85,0.1); }
}

#scorecard.sc-flash-boundary {
  animation: scBoundaryFlash 0.8s ease;
}
@keyframes scBoundaryFlash {
  0% { border-color: rgba(255,45,85,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  20% { border-color: rgba(255,215,0,0.6); box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,215,0,0.2), 0 0 60px rgba(255,215,0,0.15); }
  100% { border-color: rgba(255,45,85,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
}

#scorecard.sc-flash-wicket {
  animation: scWicketFlash 0.8s ease;
}
@keyframes scWicketFlash {
  0% { border-color: rgba(255,45,85,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  20% { border-color: rgba(255,45,85,0.7); box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,45,85,0.25), 0 0 60px rgba(255,45,85,0.2); }
  100% { border-color: rgba(255,45,85,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
}

#scorecard.sc-shake {
  animation: scShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}
@keyframes scShake {
  10%, 90% { transform: translateX(-1px); }
  20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-3px); }
  40%, 60% { transform: translateX(3px); }
}

/* ════════════════════════════════════════
   CRICKET ANIMATIONS — 4s celebrations
   ════════════════════════════════════════ */
#scorecard .sc-anim-layer { perspective: 1200px; 
  position: absolute; inset: 0;
  pointer-events: none; z-index: 999;

/* ===== BOWLED ===== */
#scorecard.sc-cricket-bold .sc-anim-bold {

}
@keyframes ab {

  12% { opacity: 1; transform: translateY(3px) skewY(-3deg) scale(1.06); letter-spacing: 2px;  }
  18% { transform: translateY(-1px) skewY(1deg) scale(1.02);  }
  24% { transform: translateY(1px) skewY(0deg) scale(1); letter-spacing: 4px;  }
  70% { opacity: 1;  }
  100% { opacity: 0; transform: translateY(10px) scale(0.9); letter-spacing: 25px;  }
}
/* ===== CAUGHT ===== */
#scorecard.sc-cricket-caught .sc-anim-caught {
  display: block; font-size: 83px; letter-spacing: 6px;
  background: linear-gradient(135deg, #ff4757 0%, #ff6348 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-shadow: 0 0 15px rgba(255,71,87,0.6), 0 0 40px rgba(255,99,72,0.3);

}
@keyframes ac {

  16% { opacity: 1; transform: translateY(0) scale(1.15);  }
  26% { transform: translateY(-8px) scale(1.04);  }
  36% { transform: translateY(0) scale(0.97);  }
  46% { transform: translateY(-2px) scale(1.01);  }
  55% { transform: translateY(0) scale(1);  }
  70% { opacity: 1;  }
  100% { opacity: 0; transform: translateY(25px) scale(0.9);  }
}
/* ===== LBW ===== */
#scorecard.sc-cricket-lbw .sc-anim-lbw {
  display: block; font-size: 98px; letter-spacing: 8px;

  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-shadow: 0 0 20px rgba(255,99,72,0.6), 0 0 50px rgba(234,179,8,0.3);
  animation: al 4s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes al {
  0% { transform: translateX(100px) rotate(-15deg) scale(0.8); opacity: 0;  }
  12% { opacity: 1;  }
  22% { transform: translateX(-5px) rotate(3deg) scale(1.08);  }
  35% { transform: translateX(1px) rotate(-1deg) scale(0.98);  }
  50% { transform: translateX(0) rotate(0deg) scale(1);  }

/* ===== RUN OUT ===== */
#scorecard.sc-cricket-runout .sc-anim-runout {
  display: block; font-size: 75px; letter-spacing: 6px;
  background: linear-gradient(135deg, #ff2d55 0%, #ff6b35 100%);

@keyframes ar {

  16% { transform: scale(1); filter: brightness(1); }
  24% { transform: translate(2px,-2px); filter: brightness(1); }
  30% { transform: translate(-2px,1px); filter: brightness(1); }
  36% { transform: translate(0,0); filter: brightness(1); }
  70% { opacity: 1; filter: brightness(1); }
  100% { opacity: 0; transform: scale(1.08) translateY(10px); filter: brightness(1.5); }
}
/* ===== DUCK ===== */
#scorecard.sc-cricket-duck .sc-anim-duck {
  display: block; font-size: 83px; letter-spacing: 6px;
  background: linear-gradient(135deg, #ffa502 0%, #ff6348 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

@keyframes ad {

  12% { opacity: 1; transform: translateX(3px) rotate(3deg) scale(1.06); letter-spacing: 4px;  }
  20% { transform: translateX(-2px) rotate(-2deg) scale(1); letter-spacing: 6px;  }
  30% { transform: translateX(1px) rotate(1deg) scale(1);  }
  40% { transform: translateX(0) rotate(0deg) scale(1);  }
   70% { opacity: 1;  }
   100% { opacity: 0; transform: translateX(25px) rotate(6deg) scale(0.88);  }
}
/* ===== WICKET (neutral — dismissal mode unknown) ===== */
#scorecard.sc-cricket-wicket .sc-anim-wicket {
  display: block; font-size: 88px; letter-spacing: 8px;
  background: linear-gradient(135deg, #ff2d55 0%, #8b5cf6 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-shadow: 0 0 20px rgba(139,92,246,0.7), 0 0 50px rgba(255,45,85,0.4);
  animation: aw 4s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes aw {
  0% { opacity: 0; transform: scale(0.1) rotate(-8deg);  }
  10% { opacity: 1; transform: scale(1.25) rotate(2deg);  }
  20% { transform: scale(0.96) rotate(-1deg);  }
  30% { transform: scale(1.04) rotate(0deg);  }
  40% { transform: scale(1) rotate(0deg);  }
  70% { opacity: 1;  }
  100% { opacity: 0; transform: scale(1.15) translateY(12px);  }

/* ════════════════════════════════════════
   MILESTONE ANIMATIONS — Futuristic celebrations
   (batter every 50: 50 / 100 / 150 / 200 / 250,
    bowler 3 / 4 / 5-wicket haul)
   Renders on its own sc-ms-layer so the classic cricket
   celebrations are never disturbed. 2-line format:
   milestone label + CONGRATULATIONS. Every event gets a
   distinct color identity.
   ════════════════════════════════════════ */
#scorecard .sc-ms-layer { perspective: 1200px; 
  position: absolute; inset: 0;
  pointer-events: none; z-index: 1000;
  border-radius: 18px;
  opacity: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px;
  will-change: opacity;
}
#scorecard .sc-ms-layer.active { opacity: 1; }
#sc-ms-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

#scorecard .sc-ms-item {
  display: none;
  position: relative;
  flex-shrink: 0;
  font-weight: 900;
  font-family: 'Orbitron', 'Montserrat', 'Arial Black', sans-serif; text-transform: uppercase;
  line-height: 1;
  max-width: 100%; max-height: 100%;
  box-sizing: border-box;
  will-change: transform, opacity;
  z-index: 1;
}
#scorecard .sc-ms-item::before,
#scorecard .sc-ms-item::after {
  content: attr(data-text);
  position: absolute; inset: 0;
  opacity: 0;
  pointer-events: none;
}
#scorecard .sc-ms-item::before { color: var(--ms-cyan); }
#scorecard .sc-ms-item::after  { color: var(--ms-magenta); }

#scorecard .sc-ms-layer::before {
  content: ''; position: absolute; left: 0; right: 0; top: -30%; height: 22%;
  background: linear-gradient(180deg, transparent, rgba(0,240,255,0.09), rgba(123,77,255,0.12), transparent);
  opacity: 0; z-index: 2;
}

/* One distinct color identity per milestone event */
#scorecard.sc-ms-50  { --ms-cyan: #00e5ff; --ms-magenta: #7b4dff; --ms-glow: rgba(0,229,255,0.45); }
#scorecard.sc-ms-100 { --ms-cyan: #ff8adf; --ms-magenta: #ff2ec4; --ms-glow: rgba(255,46,196,0.45); }
#scorecard.sc-ms-150 { --ms-cyan: #c6ff00; --ms-magenta: #00e676; --ms-glow: rgba(198,255,0,0.4); }
#scorecard.sc-ms-200 { --ms-cyan: #ffd700; --ms-magenta: #ff9100; --ms-glow: rgba(255,193,7,0.45); }
#scorecard.sc-ms-250 { --ms-cyan: #b06bff; --ms-magenta: #6d28d9; --ms-glow: rgba(176,107,255,0.45); }
#scorecard.sc-ms-3   { --ms-cyan: #00ffa3; --ms-magenta: #00c853; --ms-glow: rgba(0,255,163,0.5); }
#scorecard.sc-ms-4   { --ms-cyan: #ff5252; --ms-magenta: #d50000; --ms-glow: rgba(255,82,82,0.5); }
#scorecard.sc-ms-5   { --ms-cyan: #ff9100; --ms-magenta: #ff3d00; --ms-glow: rgba(255,145,0,0.5); }

#scorecard.sc-ms-50 .sc-ms-layer::before,
#scorecard.sc-ms-100 .sc-ms-layer::before,
#scorecard.sc-ms-150 .sc-ms-layer::before,
#scorecard.sc-ms-200 .sc-ms-layer::before,
#scorecard.sc-ms-250 .sc-ms-layer::before,
#scorecard.sc-ms-3 .sc-ms-layer::before,
#scorecard.sc-ms-4 .sc-ms-layer::before,
#scorecard.sc-ms-5 .sc-ms-layer::before {
  animation: msScan 4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes msScan {
  0% { transform: translateY(0); opacity: 0; }
  12% { opacity: 1; }
  34% { transform: translateY(560%); opacity: 0; }
  100% { transform: translateY(560%); opacity: 0; }
}

#scorecard.sc-ms-50 .sc-ms-50,
#scorecard.sc-ms-100 .sc-ms-100,
#scorecard.sc-ms-150 .sc-ms-150,
#scorecard.sc-ms-200 .sc-ms-200,
#scorecard.sc-ms-250 .sc-ms-250 {
  display: block;
  animation: msPop 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes msPop {
  0% { opacity: 0; transform: scale(0.3) rotateX(-30deg) rotateY(25deg); }
  12% { opacity: 1; transform: scale(1.15) rotateX(15deg) rotateY(-10deg); }
  22% { transform: scale(0.95) rotateX(-5deg) rotateY(5deg); }
  32% { transform: scale(1) rotateX(0deg) rotateY(0deg); }
  75% { opacity: 1; transform: scale(1) rotateX(0deg) rotateY(0deg); }
  100% { opacity: 0; transform: scale(0.6) rotateX(30deg) rotateY(-30deg); }
}
/* 3W/4W/5W hauls: wide labels (13 chars) that must never overflow the card,
   so they get the same 4s rhythm/easing as the batsman milestones but a
   smaller entrance scale that stays inside the layer (no clipping/jitter). */
#scorecard.sc-ms-3 .sc-ms-3,
#scorecard.sc-ms-4 .sc-ms-4,
#scorecard.sc-ms-5 .sc-ms-5 {
  display: flex; flex-direction: column; align-items: center;
  animation: msHaulPop 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes msHaulPop {
  0% { opacity: 0; transform: scale(0.3) rotateX(-30deg) rotateY(25deg); }
  12% { opacity: 1; transform: scale(1.05) rotateX(12deg) rotateY(-8deg); }
  22% { transform: scale(0.95) rotateX(-4deg) rotateY(4deg); }
  32% { transform: scale(1) rotateX(0deg) rotateY(0deg); }
  75% { opacity: 1; transform: scale(1) rotateX(0deg) rotateY(0deg); }
  100% { opacity: 0; transform: scale(0.6) rotateX(30deg) rotateY(-30deg); }
}
@keyframes msSplit {
  0% { opacity: 0; transform: translateX(0); }
  4% { opacity: 0.85; transform: translateX(-6px); }
  10% { opacity: 0; transform: translateX(3px); }
  28% { opacity: 0.6; transform: translateX(-5px); }
  34% { opacity: 0; transform: translateX(2px); }
  58% { opacity: 0.35; transform: translateX(-3px); }
  66% { opacity: 0; transform: translateX(4px); }
  100% { opacity: 0; transform: translateX(0); }
}
@keyframes msSplit2 {
  0% { opacity: 0; transform: translateX(0); }
  4% { opacity: 0.85; transform: translateX(6px); }
  10% { opacity: 0; transform: translateX(-3px); }
  28% { opacity: 0.6; transform: translateX(5px); }
  34% { opacity: 0; transform: translateX(-2px); }
  58% { opacity: 0.35; transform: translateX(3px); }
  66% { opacity: 0; transform: translateX(-4px); }
  100% { opacity: 0; transform: translateX(0); }
}

#scorecard .sc-ms-3.sc-ms-item::before,
#scorecard .sc-ms-4.sc-ms-item::before,
#scorecard .sc-ms-5.sc-ms-item::before,
#scorecard .sc-ms-3.sc-ms-item::after,
#scorecard .sc-ms-4.sc-ms-item::after,
#scorecard .sc-ms-5.sc-ms-item::after { content: none; }

#scorecard.sc-ms-50 .sc-ms-item::before,
#scorecard.sc-ms-100 .sc-ms-item::before,
#scorecard.sc-ms-150 .sc-ms-item::before,
#scorecard.sc-ms-200 .sc-ms-item::before,
#scorecard.sc-ms-250 .sc-ms-item::before,
#scorecard.sc-ms-3 .sc-ms-item::before,
#scorecard.sc-ms-4 .sc-ms-item::before,
#scorecard.sc-ms-5 .sc-ms-item::before { animation: msSplit 4s ease forwards; }
#scorecard.sc-ms-50 .sc-ms-item::after,
#scorecard.sc-ms-100 .sc-ms-item::after,
#scorecard.sc-ms-150 .sc-ms-item::after,
#scorecard.sc-ms-200 .sc-ms-item::after,
#scorecard.sc-ms-250 .sc-ms-item::after,
#scorecard.sc-ms-3 .sc-ms-item::after,
#scorecard.sc-ms-4 .sc-ms-item::after,
#scorecard.sc-ms-5 .sc-ms-item::after { animation: msSplit2 4s ease forwards; }

.sc-ms-item.sc-ms-50 {

  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-shadow:

  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

.sc-ms-item.sc-ms-150 {
  font-size: 138px; letter-spacing: 5px;
  background: linear-gradient(to bottom, #ffffff 0%, #f3e5f5 30%, #d500f9 50%, #aa00ff 51%, #ff00ea 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

.sc-ms-item.sc-ms-200,

  font-size: 100px; letter-spacing: 2px;

#scorecard .sc-ms-item.sc-ms-3 .ms-haul-congrats,
#scorecard .sc-ms-item.sc-ms-4 .ms-haul-congrats,
#scorecard .sc-ms-item.sc-ms-5 .ms-haul-congrats {

/* CONGRATULATIONS — line 2 of the milestone animation, below the label */
#scorecard .sc-ms-congrats-line {
  position: relative;
  flex-shrink: 0;
  margin-top: 18px;
  font-family: 'Orbitron', 'Montserrat', sans-serif;
  font-size: 28px; font-weight: 900; letter-spacing: 12px; line-height: 1;
  color: #fff;

/* ════════════════════════════════════════

   ════════════════════════════════════════ */
#like-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: none; align-items: center; justify-content: center;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(255,30,70,0.35) 0%, rgba(200,10,50,0.15) 35%, transparent 65%);
  opacity: 0;
  will-change: opacity, transform;
}
#like-overlay.active {
  display: flex;
  opacity: 1;
}
#like-overlay.active.dismissing {
  opacity: 0;
  transition: opacity 0.5s cubic-bezier(0.6, 0, 1, 0.5);
}
#like-overlay.active.dismissing .like-content {
  animation: likeContentOut 0.55s cubic-bezier(0.6, 0, 1, 0.5) both;
}
#like-overlay.active.dismissing .like-ring {
  animation: likeRingShrink 0.5s cubic-bezier(0.6, 0, 1, 0.5) both;
}
@keyframes likeContentOut {
  0% { transform: scale(1) rotate(0deg); opacity: 1;  }
  40% { transform: scale(1.08) rotate(3deg); opacity: 1;  }
  100% { transform: scale(0.4) rotate(-8deg); opacity: 0;  }
}
@keyframes likeRingShrink {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(0.3); opacity: 0; }
}
#like-overlay.active .like-content { animation: likeContentIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
#like-overlay.active .like-ring { animation: likeRingExpand 1.2s cubic-bezier(0.22, 1, 0.36, 1) both; }
#like-overlay.active .like-ring-1 { animation-delay: 0s; }
#like-overlay.active .like-ring-2 { animation-delay: 0.15s; }
#like-overlay.active .like-ring-3 { animation-delay: 0.3s; }
#like-overlay.active .like-ring-4 { animation-delay: 0.45s; }

@keyframes likeContentIn {
  0% { transform: scale(0) rotate(-10deg); opacity: 0;  }
  50% { transform: scale(1.18) rotate(2deg); opacity: 1;  }
  80% { transform: scale(0.97) rotate(-1deg); opacity: 1;  }
  100% { transform: scale(1) rotate(0deg); opacity: 1;  }
}

.like-ring {
  position: absolute; top: 50%; left: 50%;
  width: 120px; height: 120px;
  margin: -60px 0 0 -60px;
  border-radius: 50%;
  border: 2px solid transparent;
  background-origin: border-box;
  background-clip: padding-box, border-box;
  box-shadow: 0 0 30px rgba(255,45,85,0.3), inset 0 0 30px rgba(255,45,85,0.1);
  opacity: 0;
  pointer-events: none;
}
.like-ring::before {
  content: '';
  position: absolute; inset: -2px;
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(135deg, #ff2d55, #ff6bff, #00d4ff);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
@keyframes likeRingExpand {
  0% { transform: scale(1); opacity: 0.9; }
  100% { transform: scale(12); opacity: 0; }
}

#like-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

.like-content {
  position: relative; z-index: 2;
  text-align: center;
  display: flex; flex-direction: column; align-items: center;
  gap: 6px;
  filter: drop-shadow(0 0 60px rgba(255,45,85,0.4));
  will-change: transform, opacity;
}

.like-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: likeIconBeat 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
  filter: drop-shadow(0 0 40px rgba(255,23,68,0.7)) drop-shadow(0 0 80px rgba(255,20,147,0.35)) drop-shadow(0 0 140px rgba(255,0,50,0.2));
}
.like-icon svg {
  width: 130px;
  height: 130px;
  display: block;
}
@keyframes likeIconBeat {
  0% { transform: scale(0) rotate(-20deg); }
  40% { transform: scale(1.4) rotate(5deg); }
  70% { transform: scale(0.95) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.like-name {
  font-size: 63px;
  font-weight: 900;
  font-family: 'Poppins', 'Inter', sans-serif;
  background: linear-gradient(135deg, #fff 0%, #ffd9e5 30%, #ff9fae 60%, #fff 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px;
  animation: likeNameReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both, likeNameShimmer 3s ease-in-out 0.5s infinite;
  white-space: nowrap;
  max-width: 80vw;
  overflow: hidden;
  text-overflow: ellipsis;
  filter: drop-shadow(0 0 30px rgba(255,45,85,0.3));
}
@keyframes likeNameReveal {
  0% { transform: translateY(30px) scale(0.85); opacity: 0; clip-path: inset(0 100% 0 0); }
  60% { transform: translateY(-4px) scale(1.02); opacity: 1; clip-path: inset(0 0 0 0); }
  100% { transform: translateY(0) scale(1); opacity: 1; clip-path: inset(0 0 0 0); }
}
@keyframes likeNameShimmer {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.like-label {
  font-size: 33px;
  font-weight: 800;
  background: linear-gradient(135deg, #ff2d55, #ff6bff, #00d4ff, #ff9f43, #ff2d55);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 6px;
  text-transform: uppercase;

}
@keyframes likeLabelShimmer {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.like-count {
  font-size: 21px;
  font-weight: 700;
  color: rgba(255,255,255,0.5);
  letter-spacing: 3px;

  text-shadow: 0 0 20px rgba(255,255,255,0.1);
}

.like-particle {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform, opacity;
  animation: likeParticleFly 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes likeParticleFly {
  0% { transform: translate(0, 0); opacity: 1; }
  100% { transform: translate(var(--px), var(--py)); opacity: 0; }
}

  position: absolute;

@keyframes likeSparkBurst {
  0% { transform: translate(0, 0); opacity: 1; }

/* ========================================================================= */

/* 1. The Global Stream Dimmer */
body::after {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 800; /* Behind scorecard, above chat */
  transition: opacity 0.3s cubic-bezier(0.16,1,0.3,1);
}
body:has(#scorecard[class*="sc-cricket-"])::after,
body:has(#scorecard[class*="sc-ms-"])::after {
  opacity: 1; /* Dim stream when active */
}

/* 2. Supersonic Impact Shockwave */
#scorecard::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 10px; height: 10px;
  background: transparent;
  border: 10px solid rgba(255, 255, 255, 0);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: none;
  z-index: 10;
}
@keyframes cinematicShockwave {
  0% { transform: translate(-50%, -50%) scale(0.1); border-width: 40px; border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 100px rgba(255,255,255,0.6); }
  20% { transform: translate(-50%, -50%) scale(15); border-width: 10px; border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 0 50px rgba(255,255,255,0.2); }
  100% { transform: translate(-50%, -50%) scale(40); border-width: 0px; border-color: rgba(255, 255, 255, 0); box-shadow: 0 0 0px rgba(255,255,255,0); }
}
#scorecard[class*="sc-cricket-"]::before,
#scorecard[class*="sc-ms-"]::before {
  animation: cinematicShockwave 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* 3. Rotating Stadium Spotlights Behind Scorecard */
#scorecard::after {
  content: "";
  position: absolute;
  top: -100%; left: -100%;
  width: 300%; height: 300%;
  background: conic-gradient(from 0deg, 
    transparent 0%, 
    rgba(255, 255, 255, 0.05) 5%, 
    rgba(255, 255, 255, 0.4) 10%, 
    rgba(255, 255, 255, 0.05) 15%, 
    transparent 20%, 
    transparent 50%, 
    rgba(255, 255, 255, 0.05) 55%, 
    rgba(255, 255, 255, 0.4) 60%, 
    rgba(255, 255, 255, 0.05) 65%, 
    transparent 70%
  );
  opacity: 0;
  pointer-events: none;
  z-index: -1;
}
@keyframes stadiumLights {
  0% { transform: rotate(0deg) scale(1); opacity: 0; }
  10% { opacity: 1; transform: rotate(20deg) scale(1.5); }
  90% { opacity: 1; }
  100% { transform: rotate(180deg) scale(2); opacity: 0; }
}
#scorecard[class*="sc-cricket-"]::after,
#scorecard[class*="sc-ms-"]::after {
  animation: stadiumLights 4s linear forwards;
}
#scorecard.sc-cricket-6::after { background: conic-gradient(from 0deg, transparent 0%, rgba(0, 255, 136, 0.5) 10%, transparent 20%, transparent 50%, rgba(0, 255, 136, 0.5) 60%, transparent 70%); }
#scorecard.sc-flash-wicket::after { background: conic-gradient(from 0deg, transparent 0%, rgba(255, 45, 85, 0.6) 10%, transparent 20%, transparent 50%, rgba(255, 45, 85, 0.6) 60%, transparent 70%); }

/* 4. Chromatic Aberration & Lens Flare Impact on the 3D Text */
@keyframes impactFlare {
  0% { filter: brightness(3) saturate(2) drop-shadow(0 0 100px #fff); transform: scale(0.5); }
  10% { filter: brightness(1.5) saturate(1.5) drop-shadow(0 0 40px #fff); transform: scale(1.15); }
  20% { filter: brightness(1) saturate(1) drop-shadow(0 0 0px transparent); transform: scale(0.95); }
  100% { filter: brightness(1) saturate(1) drop-shadow(0 0 0px transparent); transform: scale(1); }
}

/* Base style adjustments for the new effects */
#scorecard {
  z-index: 1000; /* Ensure scorecard is above the dimmer */
}


/* Holographic Sweep */
#scorecard .sc-ms-item::after, #scorecard .sc-anim-item::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
  transform: skewX(-25deg);
  animation: cyberShine 4s infinite;
  pointer-events: none;
  z-index: 10;
}
@keyframes cyberShine {
  0% { left: -100%; }
  15% { left: 200%; }
  100% { left: 200%; }
}



/* Demo Specific Overrides */
#scorecard {
  position: relative !important;
  top: auto !important; left: auto !important;

}

body.dimming::after { opacity: 1; }

<script>
// --- INJECT REAL PARTICLE ENGINE ---
function _scCanvasInit() {
  const c = document.getElementById('sc-canvas');
  if (!c) return;
  const dpr = window.devicePixelRatio || 1;
  const layer = document.getElementById('sc-anim-layer');
  const r = layer.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  c.style.width = r.width + 'px'; c.style.height = r.height + 'px';
  _scCtx = c.getContext('2d'); _scCtx.scale(dpr, dpr);
  _scW = r.width; _scH = r.height;
}

function _scP(x, y, o) {
  const a = o.a != null ? o.a + (Math.random() - 0.5) * 0.5 : Math.random() * 6.283;
  const sp = o.sp != null ? o.sp * (0.5 + Math.random()) : 2 + Math.random() * 8;
  const clr = Array.isArray(o.c) ? o.c[Math.floor(Math.random() * o.c.length)] : (o.c || '#fff');
  const tArr = Array.isArray(o.t) ? o.t : [o.t || 0];
  const scatter = o.scatter || 0;
  return {
    x: x + (Math.random() - 0.5) * scatter,
    y: y + (Math.random() - 0.5) * scatter,
    vx: Math.cos(a) * sp + (o.dx || 0) * (0.7 + Math.random() * 0.6),
    vy: Math.sin(a) * sp + (o.dy || 0) * (0.7 + Math.random() * 0.6),
    l: (o.l || 1.5) * (0.7 + Math.random() * 0.6),
    ml: o.l || 1.5,
    s: (o.s || (2 + Math.random() * 6)) * (0.4 + Math.random() * 1.2),
    c: clr,
    d: (o.d || 0.97) * (0.96 + Math.random() * 0.04),
    g: (o.g || 0) * (0.5 + Math.random()),
    gl: o.gl || 0, op: (o.op || 0.85) * (0.5 + Math.random() * 0.5),
    t: tArr[Math.floor(Math.random() * tArr.length)],
    rot: Math.random() * 6.283,
    rotV: (Math.random() - 0.5) * 0.25,
    txt: o.txt || '',
  };
}

function _scSpawn(cx, cy, n, o) {
  for (let i = 0; i < n; i++) _scParts.push(_scP(cx, cy, o));
}

function _scRender() {
  const ctx = _scCtx;
  if (!ctx) return;
  ctx.clearRect(0, 0, _scW, _scH);
  let alive = false;
  for (let i = 0; i < _scParts.length; i++) {
    const p = _scParts[i];
    if (p.l <= 0) continue;
    alive = true;
    p.x += p.vx; p.y += p.vy;
    p.vx *= p.d; p.vy *= p.d;
    p.vy += p.g;
    p.rot += p.rotV;
    p.l -= 0.016;
    if (p.x < -50 || p.x > _scW + 50 || p.y < -50 || p.y > _scH + 50) { p.vx *= 0.98; p.vy *= 0.98; }
    const alpha = Math.max(0, p.l / p.ml);
    const sz = p.s * (0.3 + 0.7 * alpha);
    ctx.globalAlpha = alpha * p.op;
    ctx.fillStyle = p.c;
    if (p.gl) { ctx.shadowColor = p.c; ctx.shadowBlur = p.gl * alpha; }
    if (p.t === 1) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-sz, -sz * 0.3, sz * 2, sz * 0.6);
      ctx.restore();
    } else if (p.t === 2) {
      ctx.strokeStyle = p.c;
      ctx.lineWidth = 1.5 + 2 * alpha;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, 6.283); ctx.stroke();
    } else if (p.t === 3) {
      ctx.font = (sz * 2.5) + 'px Impact,system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = p.c;
      ctx.shadowBlur = (p.gl || 10) * alpha;
      ctx.fillText(p.txt || '✦', p.x, p.y);
    } else if (p.t === 4) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0, -sz);
      ctx.lineTo(-sz * 0.866, sz * 0.5);
      ctx.lineTo(sz * 0.866, sz * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (p.t === 5) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0, -sz);
      ctx.lineTo(sz * 0.7, 0);
      ctx.lineTo(0, sz);
      ctx.lineTo(-sz * 0.7, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (p.t === 6) {
      const s2 = sz * 0.4;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-s2, -s2, s2 * 2, s2 * 2);
      ctx.beginPath();
      ctx.arc(s2 * 1.5, 0, s2 * 0.5, 0, 6.283);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-s2 * 1.5, 0, s2 * 0.5, 0, 6.283);
      ctx.fill();
      ctx.restore();
    } else if (p.t === 9) { // Cyber Hexagon
      ctx.strokeStyle = p.c; ctx.lineWidth = 2 + alpha * 2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      for (let j = 0; j < 6; j++) {
        ctx.lineTo(sz * 1.5 * Math.cos(j * Math.PI / 3), sz * 1.5 * Math.sin(j * Math.PI / 3));
      }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    } else if (p.t === 10) { // Sci-Fi HUD Ring
      ctx.strokeStyle = p.c; ctx.lineWidth = 1 + alpha * 3;
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.beginPath(); ctx.arc(0, 0, sz * 2, p.rot, p.rot + Math.PI * 1.2);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, sz * 1.2, -p.rot, -p.rot + Math.PI * 0.8);
      ctx.stroke();
      ctx.restore();
    } else if (p.t === 11) { // Laser Streak
      ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillRect(-sz * 3, -sz * 0.2, sz * 6, sz * 0.4);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, 6.283); ctx.fill();
    }
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  if (alive) _scAnimFrame = requestAnimationFrame(_scRender);
  else { _scParts = []; _scAnimFrame = null; }
}

function _scSpawnEvent(eventType) {
  _scCanvasInit();
  _scParts = [];
  if (_scAnimFrame) { cancelAnimationFrame(_scAnimFrame); _scAnimFrame = null; }
  const cx = _scW / 2, cy = _scH / 2;
  if (eventType === '4') {
    _scSpawn(cx, cy, 80, { c: ['#ff2d95','#ff66b2','#ff3399','#ff0066'], l: 3.5, sp: 5 + Math.random() * 20, scatter: 80, g: 0.05, d: 0.96, gl: 14, t: [9, 10, 11, 11, 1, 4] });
    setTimeout(() => _scSpawn(cx, cy, 80, { c: ['#ff2d95','#ff66b2','#ff3399','#ff0066'], l: 3.5, sp: 5 + Math.random() * 20, scatter: 80, g: 0.05, d: 0.96, gl: 14, t: [9, 10, 11, 11, 1, 4] }), 250);
    setTimeout(() => _scSpawn(cx, cy, 30, { c: '#ff66b2', l: 2.5, sp: 1 + Math.random() * 5, scatter: 20, g: 0.08, d: 0.97, gl: 8, t: [1,4,5] }), 500);
  } else if (eventType === '6') {
    const cols = ['#00ff88','#00e676','#00c853','#69f0ae','#a7ffb8'];
    _scSpawn(cx, cy, 150, { c: cols, l: 3.8, sp: 8 + Math.random() * 25, scatter: 120, g: 0.03, d: 0.97, gl: 18, t: [9, 9, 10, 11, 11] });
    setTimeout(() => _scSpawn(cx, cy, 60, { c: '#00ff88', l: 3, sp: 2 + Math.random() * 8, scatter: 30, g: 0.06, d: 0.97, gl: 22, t: [0,1,4,5,6] }), 250);
    setTimeout(() => _scSpawn(cx, cy, 60, { c: ['#00ff88','#fff','#69f0ae'], l: 3, sp: 1 + Math.random() * 4, scatter: 60, g: 0.02, d: 0.99, gl: 10, t: 3, txt: '✦' }), 600);
  } else if (eventType === 'bold') {
    _scSpawn(cx, cy, 60, { c: ['#ff2d55','#cc0022','#ff6b6b','#ff1744'], l: 3 + Math.random(), sp: 2 + Math.random() * 10, scatter: 35, g: 0.06, d: 0.95, gl: 12, t: [9, 10, 11, 11, 2, 7] });
    setTimeout(() => _scSpawn(cx, cy, 60, { c: ['#ff2d55','#cc0022','#ff6b6b','#ff1744'], l: 3 + Math.random(), sp: 2 + Math.random() * 10, scatter: 35, g: 0.06, d: 0.95, gl: 12, t: [9, 10, 11, 11, 2, 7] }), 150);
    setTimeout(() => _scSpawn(cx, cy, 60, { c: ['#ff2d55','#cc0022','#ff6b6b','#ff1744'], l: 3 + Math.random(), sp: 2 + Math.random() * 10, scatter: 35, g: 0.06, d: 0.95, gl: 12, t: [9, 10, 11, 11, 2, 7] }), 300);
    setTimeout(() => _scSpawn(cx, cy, 30, { c: '#ff2d55', l: 2, sp: 4 + Math.random() * 8, scatter: 25, g: 0.1, d: 0.93, gl: 10, t: [1,4,5] }), 500);
  } else if (eventType === 'caught') {
    _scSpawn(cx, cy, 120, { c: ['#ff6348','#ff4757','#ff2d55','#ff9f43','#e17055'], l: 3.2, sp: 2 + Math.random() * 7, scatter: 45, g: 0.07, d: 0.97, gl: 10, t: [0,0,0,1,4,5], dy: -3 });
    setTimeout(() => _scSpawn(cx, cy, 60, { c: '#ff6348', l: 2.8, sp: 1 + Math.random() * 4, scatter: 120, g: 0.04, d: 0.98, gl: 8, t: 3, txt: '⚡', dy: -4 }), 350);
  } else if (eventType === 'lbw') {
    _scSpawn(cx, cy, 110, { c: ['#eab308','#ff6348','#fbbf24','#fff','#f59e0b'], l: 3.5, sp: 3 + Math.random() * 10, scatter: 80, g: 0.06, d: 0.97, gl: 14, t: [0,0,0,1,4,5,5] });
    setTimeout(() => _scSpawn(cx, cy, 40, { c: '#eab308', l: 2.5, sp: 2 + Math.random() * 6, scatter: 25, g: 0.06, d: 0.97, gl: 12, t: [0,1,4,5] }), 300);
    setTimeout(() => _scSpawn(cx, cy, 20, { c: '#fff', l: 2, sp: 1 + Math.random() * 3, scatter: 80, g: 0.02, d: 0.99, gl: 22, t: 3, txt: '⚖' }), 500);
  } else if (eventType === 'runout') {
    _scSpawn(cx, cy, 150, { c: ['#ff2d55','#ff6b35','#cc0022','#ff1744','#ff8a80'], l: 3.2, sp: 5 + Math.random() * 20, scatter: 120, g: 0.05, d: 0.95, gl: 12, t: [0,0,0,1,4,4,5,6] });
    setTimeout(() => _scSpawn(cx, cy, 50, { c: '#ff2d55', l: 2.5, sp: 1 + Math.random() * 5, scatter: 30, g: 0.07, d: 0.96, gl: 10, t: [1,4,5,6] }), 200);
    setTimeout(() => _scSpawn(cx, cy, 30, { c: '#ff6b35', l: 2.5, sp: 3 + Math.random() * 8, scatter: 35, g: 0.1, d: 0.94, gl: 8, t: [1,4,5] }), 500);
  } else if (eventType === 'duck') {
    _scSpawn(cx, cy, 100, { c: ['#ffa502','#ff6348','#ff8c00','#f59e0b','#ffd93d'], l: 3.2, sp: 2 + Math.random() * 8, scatter: 80, g: 0.05, d: 0.97, gl: 10, t: [0,0,0,1,4,5], dy: -1 });
    setTimeout(() => _scSpawn(cx, cy, 40, { c: '#ffa502', l: 2.5, sp: 1 + Math.random() * 4, scatter: 35, g: 0.04, d: 0.98, t: 3, txt: '🦆', dy: -3, gl: 8 }), 300);
    setTimeout(() => _scSpawn(cx, cy, 30, { c: '#ff6348', l: 2, sp: 3 + Math.random() * 6, scatter: 30, g: 0.08, d: 0.95, gl: 8, t: [1,4,5] }), 600);
  } else if (eventType === 'wicket') {
    const cols = ['#8b5cf6','#ff2d55','#a78bfa','#c084fc','#ff6b6b'];
    _scSpawn(cx, cy, 110, { c: cols, l: 3.4, sp: 3 + Math.random() * 11, scatter: 42, g: 0.06, d: 0.96, gl: 12, t: [0,0,0,1,4,5] });
    setTimeout(() => _scSpawn(cx, cy, 70, { c: ['#8b5cf6','#fff','#a78bfa'], l: 2.8, sp: 2 + Math.random() * 7, scatter: 38, g: 0.05, d: 0.97, gl: 10, t: [1,4,5] }), 200);
    setTimeout(() => _scSpawn(cx, cy, 30, { c: '#fff', l: 2.2, sp: 1 + Math.random() * 4, scatter: 45, g: 0.03, d: 0.99, gl: 16, t: 3, txt: '⚡' }), 500);
  }
  _scRender();
}

function _triggerCricketAnim(card, eventType) {
  // A milestone celebration owns the screen — queue this classic event and
  // play it the moment the milestone ends, so the two never overlap.
  if (_msAnimTimer) { _scQueued = eventType; return; }
  __animFireCount++;
  const layer = $('sc-anim-layer');
  const cls = 'sc-cricket-' + eventType;
  if (_cricketAnimTimer) { clearTimeout(_cricketAnimTimer); _cricketAnimTimer = null; }
  card.classList.remove('sc-flash-boundary', 'sc-flash-wicket', 'sc-shake', 'sc-update',
    'sc-cricket-4', 'sc-cricket-6',
    'sc-cricket-bold', 'sc-cricket-caught',

function _scDemoLoop() {

/* ════════════════════════════════════════
   MILESTONE ENGINE — batter 50/100/150/200/250, bowler 3/4/5-wicket haul
   Fires off live score deltas in updateScore (never on the first
   snapshot), renders on its own sc-ms-layer (2 lines: milestone
   label + CONGRATULATIONS) so the classic cricket celebrations
   are untouched.
   ════════════════════════════════════════ */
let _msCtx = null, _msW = 0, _msH = 0, _msParts = [], _msFrame = null;
let _msAnimTimer = null;
let _msQueued = null;   // milestone held while a classic celebration runs
let _scQueued = null;   // classic celebration held while a milestone runs
let _msBatter = {};        // batter name -> Set of milestone runs already celebrated
let _msBowler = null;      // { name, lastWk, fired: Set }

const _glowCache = {};
const _textSpriteCache = {};
const _MAX_PARTS = 320;
const _TEXT_SPRITE_PX = 96;
const _TEXT_SPRITE_FONT = 64;
function _glowSprite(color) {
  let s = _glowCache[color];
  if (s) return s;
  s = document.createElement('canvas');
  const S = 64;
  s.width = S; s.height = S;
  const g = s.getContext('2d');
  const grad = g.createRadialGradient(S / 2, S / 2, 1, S / 2, S / 2, S / 2);
  grad.addColorStop(0, color);
  grad.addColorStop(0.55, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  _glowCache[color] = s;
  return s;
}
// Pre-renders a glowing text/emoji glyph ONCE (per color+text) so the render
// loop only does a cheap scaled drawImage instead of per-frame fillText
// (rasterizing an emoji glyph each frame was ~1.3ms — the haul jank source).
function _textSprite(color, txt) {
  const key = color + '|' + txt;
  let s = _textSpriteCache[key];
  if (s) return s;
  const S = _TEXT_SPRITE_PX;
  s = document.createElement('canvas');
  s.width = S; s.height = S;
  const g = s.getContext('2d');
  const F = _TEXT_SPRITE_FONT;
  const grad = g.createRadialGradient(S / 2, S / 2, F * 0.2, S / 2, S / 2, S / 2);
  grad.addColorStop(0, color);
  grad.addColorStop(0.55, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  g.font = F + 'px Impact,system-ui';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#fff';
  g.fillText(txt, S / 2, S / 2);
  _textSpriteCache[key] = s;
  return s;
}

function _msCanvasInit() {
  const c = document.getElementById('sc-ms-canvas');
  if (!c) return;
  const dpr = window.devicePixelRatio || 1;
  const layer = document.getElementById('sc-ms-layer');
  const r = layer.getBoundingClientRect();
  c.width = Math.max(10, r.width * dpr); c.height = Math.max(10, r.height * dpr);
  c.style.width = r.width + 'px'; c.style.height = r.height + 'px';
  _msCtx = c.getContext('2d'); _msCtx.scale(dpr, dpr);
  _msW = r.width; _msH = r.height;
}

function _msSpawn(cx, cy, n, o) {
  for (let i = 0; i < n && _msParts.length < _MAX_PARTS; i++) _msParts.push(_scP(cx, cy, o));
}

function _msRender() {
  const ctx = _msCtx;
  if (!ctx) return;
  ctx.clearRect(0, 0, _msW, _msH);
  let alive = false;
  for (let i = 0; i < _msParts.length; i++) {
    const p = _msParts[i];
    if (p.l <= 0) continue;
    alive = true;
    p.x += p.vx; p.y += p.vy;
    p.vx *= p.d; p.vy *= p.d;
    p.vy += p.g;
    p.rot += p.rotV;
    p.l -= 0.016;
    if (p.x < -60 || p.x > _msW + 60 || p.y < -60 || p.y > _msH + 60) { p.vx *= 0.98; p.vy *= 0.98; }
    const alpha = Math.max(0, p.l / p.ml);
    const sz = p.s * (0.3 + 0.7 * alpha);
    ctx.globalAlpha = alpha * p.op;
    ctx.fillStyle = p.c;
    if (p.gl) { const gr = sz * 3.4; ctx.drawImage(_glowSprite(p.c), p.x - gr, p.y - gr, gr * 2, gr * 2); }
    if (p.t === 1) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-sz, -sz * 0.3, sz * 2, sz * 0.6); ctx.restore();
    } else if (p.t === 2) {
      ctx.strokeStyle = p.c; ctx.lineWidth = 1.5 + 2 * alpha;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz, 0); ctx.lineTo(0, sz); ctx.lineTo(-sz, 0);
      ctx.closePath(); ctx.stroke(); ctx.restore();
    } else if (p.t === 3) {
      const spr = _textSprite(p.c, p.txt || '0');
      const target = sz * 2.2 / _TEXT_SPRITE_FONT * _TEXT_SPRITE_PX;
      ctx.drawImage(spr, p.x - target / 2, p.y - target / 2, target, target);
    } else if (p.t === 4) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(-sz * 0.866, sz * 0.5); ctx.lineTo(sz * 0.866, sz * 0.5);
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else if (p.t === 5) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz * 0.7, 0); ctx.lineTo(0, sz); ctx.lineTo(-sz * 0.7, 0);
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else if (p.t === 7) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const r = k % 2 === 0 ? sz : sz * 0.45;
        const ang = -Math.PI / 2 + k * Math.PI / 5;
        const px = Math.cos(ang) * r, py = Math.sin(ang) * r;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else if (p.t === 9) { // Cyber Hexagon
      ctx.strokeStyle = p.c; ctx.lineWidth = 2 + alpha * 2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      for (let j = 0; j < 6; j++) {
        ctx.lineTo(sz * 1.5 * Math.cos(j * Math.PI / 3), sz * 1.5 * Math.sin(j * Math.PI / 3));
      }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    } else if (p.t === 10) { // Sci-Fi HUD Ring
      ctx.strokeStyle = p.c; ctx.lineWidth = 1 + alpha * 3;
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.beginPath(); ctx.arc(0, 0, sz * 2, p.rot, p.rot + Math.PI * 1.2);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, sz * 1.2, -p.rot, -p.rot + Math.PI * 0.8);
      ctx.stroke();
      ctx.restore();
    } else if (p.t === 11) { // Laser Streak
      ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillRect(-sz * 3, -sz * 0.2, sz * 6, sz * 0.4);
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-sz, -sz, sz * 2, sz * 2); ctx.restore();
    }
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  if (alive) _msFrame = requestAnimationFrame(_msRender);
  else { _msParts = []; _msFrame = null; }
}

function _triggerMilestoneAnim(card, type, name) {
  const layer = document.getElementById('sc-ms-layer');
  if (!card || !layer) return;
  // A classic celebration owns the screen — hold this milestone and play it
  // the moment that animation ends, so the two never overlap.
  if (_cricketAnimTimer) { _msQueued = { type, name }; return; }
  const cls = type === 'haul3' ? 'sc-ms-3'
    : type === 'haul4' ? 'sc-ms-4'
    : type === 'haul5' ? 'sc-ms-5'
    : 'sc-ms-' + type;
  if (_msAnimTimer) { clearTimeout(_msAnimTimer); _msAnimTimer = null; }
  card.classList.remove('sc-ms-50', 'sc-ms-100', 'sc-ms-150', 'sc-ms-200', 'sc-ms-250', 'sc-ms-3', 'sc-ms-4', 'sc-ms-5');
  layer.classList.remove('active');
  void card.offsetWidth;
  card.classList.add(cls);
  layer.classList.add('active');
  _msSpawnEvent(type);
  _msAnimTimer = setTimeout(() => {
    card.classList.remove('sc-ms-50', 'sc-ms-100', 'sc-ms-150', 'sc-ms-200', 'sc-ms-250', 'sc-ms-3', 'sc-ms-4', 'sc-ms-5');
    layer.classList.remove('active');
    _msAnimTimer = null;
    // A classic celebration that arrived mid-milestone plays the moment this ends.
    if (_scQueued) { const q = _scQueued; _scQueued = null; _triggerCricketAnim(card, q); }
  }, 4000);
}

// Returns the biggest milestone crossed this update, or null. Never fires on
// the first snapshot (the caller gates on prev) so a half-watched match does
// not celebrate milestones that fell before the overlay opened.
function _detectMilestones(merged) {
  if (!merged || !Array.isArray(merged.batsmen)) return null;
  let out = null;
  (merged.batsmen || []).forEach(b => {
    if (!b || !b.name) return;
    const runs = parseInt(b.runs, 10);
    if (isNaN(runs)) return;
    const set = _msBatter[b.name] || (_msBatter[b.name] = new Set());
    // Same name back below 30 = a fresh innings, allow the milestone again.
    if (runs < 30 && set.has(50)) set.clear();
    const crossed = [50, 100, 150, 200, 250].filter(m => runs >= m && !set.has(m));
    if (crossed.length) {
      const m = crossed[crossed.length - 1];
      set.add(m);
      out = { type: m, name: b.name };
    }
  });
  const bw = merged.bowler;
  if (bw && bw.name) {
    const wk = parseInt(bw.wickets, 10);
    const wkNum = isNaN(wk) ? 0 : wk;
    if (!_msBowler || _msBowler.name !== bw.name) {
      _msBowler = { name: bw.name, lastWk: wkNum, fired: new Set() };
    } else {
      const prevWk = _msBowler.lastWk;
      // Only celebrate hauls actually crossed this update (baseline on first
      // sighting never fires) and each haul exactly once per bowler spell.
      const hauls = [3, 4, 5].filter(h => wkNum >= h && h > prevWk && !_msBowler.fired.has(h));
      if (hauls.length) {
        const h = hauls[hauls.length - 1];
        _msBowler.fired.add(h);
        out = { type: 'haul' + h, name: bw.name };
      }
      _msBowler.lastWk = Math.max(_msBowler.lastWk, wkNum);
    }
  }
  return out;
}

  if (type === 50) congratsLine.textContent = "HALF CENTURY!";
  else if (type === 100) congratsLine.textContent = "CENTURY!";
  else if (type === 150) congratsLine.textContent = "150 RUNS!";
  else if (type === 'haul3') congratsLine.textContent = "3 WICKET HAUL!";
  
  void card.offsetWidth;
  card.classList.add(cls);
  layer.classList.add('active');
  document.body.classList.add('dimming');
  
  _msSpawnEvent(type);
  
  window._msAnimTimer = setTimeout(() => {
    card.classList.remove(cls);
    layer.classList.remove('active');
    document.body.classList.remove('dimming');
  }, 4000);
}
</script>
</body>
